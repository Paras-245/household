<!-- templates/rate_service.html -->
{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Rate Service: {{ service.name }}</h2>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert alert-dismissible fade show" role="alert">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} mb-2">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Rating Form -->
    <!-- Rating Form -->
<form method="POST">
    <div class="form-group">
        <label for="rating">Rating</label>
        <select class="form-control" id="rating" name="rating" required>
            <option value="">Select a rating</option>
            <option value="1">1 - Poor</option>
            <option value="2">2 - Fair</option>
            <option value="3">3 - Good</option>
            <option value="4">4 - Very Good</option>
            <option value="5">5 - Excellent</option>
        </select>
    </div>

    <div class="form-group">
        <label for="comment">Comment (Optional)</label>
        <textarea class="form-control" id="comment" name="comment" rows="4"></textarea>
    </div>

    <!-- Hidden input field to send the service_id -->
    <input type="hidden" name="service_id" value="{{ service.id }}">

    <button type="submit" class="btn btn-primary mt-3">Submit Rating</button>
</form>

<a href="{{ url_for('service_details', service_id=service.id) }}" class="btn btn-secondary mt-3">Back to Service Details</a>
